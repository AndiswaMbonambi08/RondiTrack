name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore RondiTrack.slnx
      - run: dotnet build RondiTrack.slnx -c Release --no-restore
      - run: dotnet test RondiTrack.slnx -c Release --no-build

  # Fast frontend checks, next to the backend job. Vitest runs in the CI zone (UTC) and in the members' zone.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-next
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-next/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Vitest (TZ=UTC)
        run: npx vitest run
        env:
          TZ: UTC
      - name: Vitest (TZ=Africa/Johannesburg)
        run: npx vitest run
        env:
          TZ: Africa/Johannesburg

  # Slow: only after BOTH fast jobs pass.
  e2e:
    needs: [build-and-test, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Not secrets: names only, for the throwaway database.
      POSTGRES_DB: ronditrack
      POSTGRES_USER: ronditrack
      E2E_API_URL: http://localhost:5051
      API_BASE_URL: http://localhost:5051
    steps:
      - uses: actions/checkout@v6

      # No real secret anywhere: every value is made fresh in this run and masked in the logs.
      - name: Throwaway secrets for this run
        run: |
          set -euo pipefail
          POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          JWT_SIGNING_KEY="$(openssl rand -base64 48 | tr -d '\n')"
          SEED_DEMO_PASSWORD="Aa1-$(openssl rand -hex 12)"
          SESSION_SECRET="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')"
          for v in POSTGRES_PASSWORD JWT_SIGNING_KEY SEED_DEMO_PASSWORD SESSION_SECRET; do
            echo "::add-mask::${!v}"
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done

      - name: Start the API and a fresh database (seeded, with the 40-member stokvel)
        run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build

      - name: Wait until the API is ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5051/health/ready > /dev/null; then exit 0; fi
            sleep 3
          done
          docker compose logs --tail=200
          exit 1

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-next/package-lock.json

      - name: Install, build, install Chromium
        working-directory: web-next
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Playwright (production build, axe and metadata tests included)
        working-directory: web-next
        run: npm run test:e2e

      - name: Keep the HTML report when the run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web-next/playwright-report
            web-next/test-results
          retention-days: 14

      - name: API logs when the run fails
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t ronditrack:ci .